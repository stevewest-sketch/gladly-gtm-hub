<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar {
  background: #009B00; height: 8pt; width: 100%;
}
.content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  margin: 0 50pt;
}
.logo-placeholder {
  background: #F3F3F3; border: 2pt dashed #AAAAAA; border-radius: 8pt;
  width: 120pt; height: 50pt; display: flex; align-items: center; justify-content: center;
  margin-bottom: 30pt;
}
.logo-text { color: #4A4A4A; font-size: 11pt; text-align: center; }
.title { color: #0D0D0D; font-size: 42pt; font-weight: bold; margin: 0 0 20pt 0; line-height: 1.2; }
.subtitle { color: #4A4A4A; font-size: 20pt; font-weight: normal; margin: 0 0 40pt 0; }
.footer {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0 50pt 25pt 50pt;
}
.confidential { color: #AAAAAA; font-size: 10pt; }
</style>
</head>
<body>
<div class="header-bar"></div>
<div class="content">
  <div class="logo-placeholder">
    <p class="logo-text">[COMPANY LOGO]</p>
  </div>
  <h1 class="title">AI Deployment<br>POC Kickoff</h1>
  <p class="subtitle">Partnering for AI-powered customer experience success</p>
</div>
<div class="footer">
  <p class="confidential">Gladly Confidential</p>
</div>
</body>
</html>
