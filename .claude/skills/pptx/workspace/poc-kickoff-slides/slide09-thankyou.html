<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1A1A1A; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  align-items: center; text-align: center;
}
.title { color: #FFFFFF; font-size: 36pt; font-weight: bold; margin: 0 0 15pt 0; }
.subtitle { color: #AAAAAA; font-size: 16pt; margin: 0 0 40pt 0; }
.cta-box {
  background: #009B00; border-radius: 8pt; padding: 15pt 40pt;
}
.cta-text { color: #FFFFFF; font-size: 14pt; font-weight: bold; margin: 0; }
.footer { display: flex; justify-content: center; margin-bottom: 25pt; }
.confidential { color: #4A4A4A; font-size: 10pt; }
</style>
</head>
<body>
<div class="content">
  <h1 class="title">Let's Build Something Great</h1>
  <p class="subtitle">We're excited to partner with [COMPANY] on this AI journey</p>
  <div class="cta-box">
    <p class="cta-text">Questions? Let's discuss.</p>
  </div>
</div>
<div class="footer">
  <p class="confidential">Gladly Confidential</p>
</div>
</body>
</html>
