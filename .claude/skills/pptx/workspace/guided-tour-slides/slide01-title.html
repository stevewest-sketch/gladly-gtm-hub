<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #8C69F0; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  margin: 0 60pt;
}
.badge {
  background: #FFFFFF; border-radius: 20pt; padding: 6pt 16pt;
  display: inline-block; width: fit-content; margin-bottom: 25pt;
}
.badge-text { color: #8C69F0; font-size: 11pt; font-weight: bold; margin: 0; }
.title { color: #FFFFFF; font-size: 40pt; font-weight: bold; margin: 0 0 15pt 0; line-height: 1.2; }
.subtitle { color: #C5B3F8; font-size: 18pt; font-weight: normal; margin: 0; }
.footer { display: flex; justify-content: center; margin-bottom: 25pt; }
.confidential { color: #C5B3F8; font-size: 10pt; }
</style>
</head>
<body>
<div class="content">
  <div class="badge">
    <p class="badge-text">POC TRAINING</p>
  </div>
  <h1 class="title">Guided Tour:<br>Getting Started with Gladly AI</h1>
  <p class="subtitle">Hands-on exercises to master Sidekick, Answers, and Guides</p>
</div>
<div class="footer">
  <p class="confidential">Gladly Confidential</p>
</div>
</body>
</html>
